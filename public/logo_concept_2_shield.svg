<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21201d"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>

    <!-- Warm Amber Seeker Wing -->
    <linearGradient id="wingOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Emerald Provider Wing -->
    <linearGradient id="wingGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Golden Star Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad2)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.08"/>

  <!-- Left Wing: Seeker (Orange) Shield Half -->
  <path d="M 256 90 L 160 135 C 150 240, 190 350, 256 425 L 256 90 Z" 
        fill="url(#wingOrange)" 
        opacity="0.95"/>

  <!-- Right Wing: Provider (Emerald Green) Shield Half -->
  <path d="M 256 90 L 352 135 C 362 240, 322 350, 256 425 L 256 90 Z" 
        fill="url(#wingGreen)" 
        opacity="0.95"/>

  <!-- Inner Dynamic S Cutout / Ribbon -->
  <path d="M 256 120 C 295 120, 320 145, 320 185 C 320 235, 230 245, 230 285 C 230 315, 255 335, 285 335 C 305 335, 320 325, 330 310" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round"/>

  <path d="M 256 390 C 217 390, 192 365, 192 325 C 192 275, 282 265, 282 225 C 282 195, 257 175, 227 175 C 207 175, 192 185, 182 200" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round"
        opacity="0.4"/>

  <!-- Center Verified Star Badge -->
  <circle cx="256" cy="256" r="32" fill="#141311" stroke="#ffffff" stroke-width="6"/>
  <polygon points="256,234 263,249 279,251 267,263 270,279 256,271 242,279 245,263 233,251 249,249" fill="url(#goldGrad)" filter="url(#glow2)"/>
</svg>
