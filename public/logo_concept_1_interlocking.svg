<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24221e"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>
    
    <!-- Orange Seeker Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Emerald Provider Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Center Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad1)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.08"/>

  <!-- Top Ribbon: Seeker Energy (Orange) -->
  <path d="M 350 145 C 350 145, 230 115, 175 165 C 120 215, 150 280, 245 285 L 275 288 C 340 292, 385 340, 345 405 C 315 450, 230 460, 160 415" 
        fill="none" 
        stroke="url(#orangeGrad)" 
        stroke-width="54" 
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.25"
        filter="url(#softGlow)"/>

  <!-- Interlocking S: Top Curve (Orange) -->
  <path d="M 370 170 C 370 120, 310 95, 256 95 C 180 95, 140 140, 140 205 C 140 285, 250 285, 280 295 C 345 315, 375 355, 365 405 C 355 455, 285 490, 210 470" 
        fill="none" 
        stroke="url(#orangeGrad)" 
        stroke-width="52" 
        stroke-linecap="round"/>

  <!-- Interlocking S: Bottom Curve & Node (Emerald Green) -->
  <path d="M 142 342 C 142 392, 202 417, 256 417 C 332 417, 372 372, 372 307 C 372 227, 262 227, 232 217 C 167 197, 137 157, 147 107" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="48" 
        stroke-linecap="round"/>

  <!-- Interlocking Hub Connection Core (White/Amber Starlet) -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="8" fill="#f59e0b"/>
</svg>
