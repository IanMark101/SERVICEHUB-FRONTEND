<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark App Icon Background -->
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#201f1b"/>
      <stop offset="50%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#100f0e"/>
    </linearGradient>

    <!-- Seeker Orange Gradient -->
    <linearGradient id="favSeekerOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Provider Emerald Gradient -->
    <linearGradient id="favProviderGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#favBgGrad)"/>

  <!-- Upper Ribbon: Seeker Community -->
  <path d="M 372 176 C 372 122, 318 96, 256 96 C 182 96, 140 144, 140 210 C 140 286, 250 288, 282 298 C 348 318, 376 358, 366 408 C 356 458, 286 492, 212 472" 
        fill="none" 
        stroke="url(#favSeekerOrange)" 
        stroke-width="54" 
        stroke-linecap="round"/>

  <!-- Lower Ribbon: Provider Craft -->
  <path d="M 140 336 C 140 390, 194 416, 256 416 C 330 416, 372 368, 372 302 C 372 226, 262 224, 230 214 C 164 194, 136 154, 146 104" 
        fill="none" 
        stroke="url(#favProviderGreen)" 
        stroke-width="52" 
        stroke-linecap="round"/>

  <!-- Center Hub Node -->
  <circle cx="256" cy="256" r="26" fill="#181715" stroke="#f97316" stroke-width="4"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  <circle cx="256" cy="256" r="7" fill="#f59e0b"/>
</svg>