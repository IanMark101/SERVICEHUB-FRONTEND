<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark App Icon Background -->
    <linearGradient id="shBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#201f1b"/>
      <stop offset="50%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#100f0e"/>
    </linearGradient>

    <!-- Seeker Orange Gradient (System Exact: orange-500 to orange-600) -->
    <linearGradient id="shSeekerOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Provider Emerald Gradient (System Exact: emerald-500 to emerald-600) -->
    <linearGradient id="shProviderGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Subtle Ambient Backlight -->
    <radialGradient id="shAmbientOrange" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shAmbientGreen" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Core Glow -->
    <filter id="shCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#shBgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.08"/>

  <!-- Ambient Workspace Glows -->
  <circle cx="180" cy="180" r="160" fill="url(#shAmbientOrange)"/>
  <circle cx="332" cy="332" r="160" fill="url(#shAmbientGreen)"/>

  <!-- Upper Ribbon: Seeker Community (Warm Radiant Orange) -->
  <path d="M 372 176 C 372 122, 318 96, 256 96 C 182 96, 140 144, 140 210 C 140 286, 250 288, 282 298 C 348 318, 376 358, 366 408 C 356 458, 286 492, 212 472" 
        fill="none" 
        stroke="url(#shSeekerOrange)" 
        stroke-width="50" 
        stroke-linecap="round"/>

  <!-- Lower Ribbon: Provider Craft & Trust (Fresh Emerald Green) -->
  <path d="M 140 336 C 140 390, 194 416, 256 416 C 330 416, 372 368, 372 302 C 372 226, 262 224, 230 214 C 164 194, 136 154, 146 104" 
        fill="none" 
        stroke="url(#shProviderGreen)" 
        stroke-width="48" 
        stroke-linecap="round"/>

  <!-- Cordova Hub Center Node (Dual Connection Intersection) -->
  <circle cx="256" cy="256" r="24" fill="#181715" stroke="#f97316" stroke-width="4" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#shCoreGlow)"/>
  <circle cx="256" cy="256" r="7" fill="#f59e0b"/>
</svg>
