<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matte Deep Obsidian Base Tile -->
    <linearGradient id="shTileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161514"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </linearGradient>

    <!-- Subtle 1px Specular Bevel -->
    <linearGradient id="shBevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Upper S Gradient: Only the terminal cap has a touch of orange, 80%+ is pure solid white -->
    <linearGradient id="shUpperTerminalGrad" x1="364" y1="176" x2="256" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Lower S Gradient: Pure solid white throughout, only the bottom terminal cap has a touch of green -->
    <linearGradient id="shLowerTerminalGrad" x1="256" y1="424" x2="144" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Deep Matte Obsidian Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#shTileGrad)"/>

  <!-- Top Specular Inner Bevel Stroke -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#shBevelGrad)" stroke-width="2.5"/>

  <!-- Main S Spine & Body: 100% Solid Pure Crisp White -->
  <path d="M 256 88
           C 188 88, 144 128, 144 192
           C 144 268, 368 244, 368 320
           C 368 384, 324 424, 256 424"
        fill="none"
        stroke="#ffffff"
        stroke-width="68"
        stroke-linejoin="round"/>

  <!-- Upper Terminal Hook: Crisp White seamlessly blending to an Orange Cap at the tip -->
  <path d="M 364 176
           C 364 122, 318 88, 256 88"
        fill="none"
        stroke="url(#shUpperTerminalGrad)"
        stroke-width="68"
        stroke-linecap="round"/>

  <!-- Lower Terminal Hook: Crisp White seamlessly blending to a Green Cap at the tip -->
  <path d="M 256 424
           C 188 424, 144 390, 144 336"
        fill="none"
        stroke="url(#shLowerTerminalGrad)"
        stroke-width="68"
        stroke-linecap="round"/>
</svg>
